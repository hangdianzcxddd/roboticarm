# LingBo-VLA -> Piper first integration profile.
# Values are intentionally conservative. Confirm the cloud action units before
# enabling --execute.
ws_url: "ws://127.0.0.1:9330"
protocol: "lingbot_msgpack"
image_key: "observation.images.cam_high"
mirror_wrist_images: true
reset_on_connect: true
instruction: "抓取目标物体"
camera_index: 0
camera_width: 640
camera_height: 480
camera_fps: 30
jpeg_quality: 90
hz: 2.0
max_steps: 20
connect_timeout_s: 10.0
# First inference can take more than three minutes while PyTorch compiles and
# autotunes kernels. This is a receive timeout, not the arm execution period.
receive_timeout_s: 600.0
reconnect: true
max_reconnects: 3
speed_percent: 5
execute_period_s: 0.5

# LingBo action rows are [j1..j6, gripper]. The default model contract here
# assumes absolute Piper joint positions in radians and gripper millimeters.
action_semantics: absolute
arm_unit: rad
gripper_unit: mm
arm_scale: 1.0
arm_bias: 0.0
gripper_scale: 1.0
gripper_bias: 0.0
open_mm: 0.0
close_mm: -100.0
max_joint_delta_rad: [0.035, 0.035, 0.035, 0.05, 0.05, 0.08]
max_gripper_delta_mm: 10.0
min_gripper_mm: -100.0
max_gripper_mm: 0.0
