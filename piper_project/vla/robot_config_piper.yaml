# LingBot-VLA cloud robot config for PiPER-X.
# Copy this file to: configs/robot_configs/piper.yaml
#
# Raw WebSocket observation contract:
#   observation.images.cam_high        = RGB uint8 image, shape (H, W, 3)
#   observation.images.cam_left_wrist  = RGB uint8 image, shape (H, W, 3)
#   observation.images.cam_right_wrist = RGB uint8 image, shape (H, W, 3)
#   observation.state                  = float32 [j1..j6, gripper]
#
# Raw action contract after FeatureTransform.unapply():
#   action = float32 [j1..j6, gripper]
states:
  - observation.state.arm.position:
      origin_keys:
        - observation.state: {start: 0, end: 6}

  - observation.state.effector.position:
      origin_keys:
        - observation.state: {start: 6, end: 7}

actions:
  - action.arm.position:
      origin_keys:
        - action: {start: 0, end: 6}
      subtract_state: false

  - action.effector.position:
      origin_keys:
        - action: {start: 6, end: 7}
      subtract_state: false

images:
  - observation.images.camera_top:
      origin_keys: observation.images.cam_high

  - observation.images.camera_wrist_left:
      origin_keys: observation.images.cam_left_wrist

  - observation.images.camera_wrist_right:
      origin_keys: observation.images.cam_right_wrist

# Normalization statistics are supplied by the deployed inference/training
# config (data.norm_stats_file or --robot_norm_path). They must contain stats
# compatible with this 6+1 PiPER-X state/action mapping.
